- name: individuals
  schema: dairy
  type: BASE TABLE
  comment: The primary table for storing records about an individual. We are modeling this table after the [schema:Person](https://schema.org/Person) data model to some degree, for broader compatibility.
  columns:
    - $ref: columns/individualid.yaml
    - name: fullname
      type: text
      comment: Full name of an individual, in written order (i.e., as they would write their names)
      x-reference:
      - ontology: schema
        term: schema:name
        relation: exactMatch
    - name: formalname
      type: text
      comment: >-
        This is the last name, family name, or singular name that would lead in a journal citation, 
        or when the individual is formally addressed.
      x-reference:
      - ontology: schema
        term: schema:familyname
        url: https://schema.org/familyName
        relation: closeMatch
        nullable: true
    - name: preferredname
      type: text
      comment: For individuals who have a preferred name that is not the same as their given name.
      x-reference:
      - ontology: schema
        term: schema:alternateName
        url: https://schema.org/alternateName
    - $ref: columns/datecreated.yaml
    - $ref: columns/datemodified.yaml
    - name: supersedingrecordid
      comment: >-
        In the case a record is replaced with an alternative record (for example an individual changes 
        their name, but the "old" name remains in the publication list).
      type: UUID7
      x-reference:
      - ontology: PAV
        term: PAV:hasCurrentVersion
        relation: exactMatch
        url: http://purl.org/pav/hasCurrentVersion
  constraints:
  - name: individual_pk
    comment: The primary key for the table (comes with indexing as well).
    type: PRIMARY KEY
    ddl: PRIMARY KEY(individualid)
    columns:
      - individualid
